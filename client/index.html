<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Feetcode - free DSA prep that visualizes the code you write: every run, every failure, every optimization." />
    <meta name="theme-color" content="#090817" />
    <title>feetcode¹ - see why your code works</title>
    <script>
      {
        // your own choice, then one the host page already set, then the system setting
        let stored = null;
        try { stored = localStorage.getItem("fc:theme"); } catch { /* storage blocked */ }
        const t = stored || document.documentElement.dataset.theme;
        const dark = t ? t === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
